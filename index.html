<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Radial Animated Background -->
    <div class="bg-pulse"></div>

    <!-- Main Landing Page Content -->
    <div class="main-content">
        <header id="landing-header">
            <button id="info-btn" class="icon-btn top-left" aria-label="Information">
                <img src="assets/info button.svg" alt="Info">
            </button>
            
            <button id="exit-btn" class="icon-btn top-right">
                <img src="assets/exit button.svg" alt="Exit"> 
                <div id="exit-progress-fill" class="exit-progress-fill"></div>
            </button>
        </header>
        
        <main id="start-screen">
            <div class="center-logo">
                <img src="assets/Devotion.svg" alt="Devotion Title">
            </div>
            
            <div class="bottom-text">
                <p>Click anywhere to start</p>
            </div>
        </main>
    </div>

    <!-- Cursor Gap Target -->
    <img src="assets/cursor gap.svg" id="cursor-gap" alt="Cursor Gap target">

    <!-- Info Modal Overlay -->
    <div id="info-modal" class="modal-overlay">
        <div class="modal-card">
            <button id="close-btn" class="close-btn" aria-label="Close">
                <img src="assets/close button.svg" alt="Close">
            </button>
            
            <div class="typewriter-container">
                <span id="typed-text"></span><span id="cursor" class="cursor">|</span>
            </div>
        </div>
    </div>

    <!-- Exit Modal Overlay -->
    <div id="exit-modal" class="modal-overlay">
        <div class="exit-modal-wrapper">
            <div class="exit-modal-card">
                <div class="exit-text-container">
                    <span id="exit-typed-text"></span><span id="exit-cursor" class="cursor">|</span>
                </div>
            </div>
            <div class="exit-actions">
                <button id="stay-btn" class="exit-action-btn">
                    <img src="assets/Stay.svg" alt="Stay"> 
                </button>
                <button id="leave-btn" class="exit-action-btn">
                    <img src="assets/Leave.svg" alt="Leave"> 
                </button>
            </div>
        </div>
    </div>

    <!-- Introduction Modal Overlay -->
    <div id="intro-modal" class="modal-overlay">
        <div class="exit-modal-wrapper">
            <div class="modal-card">
                <div class="typewriter-container" style="width: 85%; max-width: 620px;">
                    <span id="intro-typed-text"></span><span id="intro-cursor" class="cursor">|</span>
                </div>
            </div>
            <div class="exit-actions" style="justify-content: center; margin-top: -3%;">
                <button id="next-btn" class="exit-action-btn">
                    <img src="assets/Next.svg" alt="Next">
                </button>
            </div>
        </div>
    </div>

    <!-- Ready Modal Overlay -->
    <div id="ready-modal" class="modal-overlay">
        <div class="exit-modal-wrapper">
            <div class="modal-card">
                <div class="typewriter-container" style="width: 85%; max-width: 620px;">
                    <span id="ready-typed-text"></span><span id="ready-cursor" class="cursor">|</span>
                </div>
            </div>
            <div class="exit-actions" style="justify-content: center; margin-top: -3%;">
                <button id="im-ready-btn" class="exit-action-btn">
                    <img src="assets/I’m ready.svg" alt="I'm ready">
                </button>
            </div>
        </div>
    </div>

    <!-- Oblivion Lockout Screen -->
    <div id="oblivion-screen" class="oblivion-screen">
        <p id="oblivion-text" class="oblivion-text"></p>
    </div>

    <!-- Story Text Elements -->
    <div id="story-text-phase1" class="flame-story-text">"It's cold in here.<br>Keep me warm..."</div>
    <div id="story-text-phase2" class="flame-story-text">"It's fading. I need<br>more. Click faster."</div>
    <div id="story-text-phase3" class="flame-story-text">"Yes... keep feeding it.<br>Don't let us die."</div>

    <!-- Top Left Hint Text SVG Assets -->
    <img id="click-drop-hint" src="assets/Click to drop.svg" alt="Click to drop the love sense">
    <img id="done-enough-hint" src="assets/You've done enough.svg" alt="You've done enough. It's time to leave">
    <img id="wait-hint" src="assets/Wait.svg" alt="Wait! There’s no way to leave. You fed it for too long...">

    <script src="script.js"></script>
</body>
</html>
